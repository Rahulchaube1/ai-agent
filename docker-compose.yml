version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - flowforge-net

  redis:
    image: redis:7-alpine
    container_name: flowforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - flowforge-net

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: flowforge-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-flowforge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      DATABASE_NAME: ${POSTGRES_DB:-flowforge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowforge-net

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: flowforge-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:4000
    depends_on:
      - backend
    networks:
      - flowforge-net

  worker:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: flowforge-worker
    restart: unless-stopped
    command: node dist/worker.js
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-flowforge}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-flowforge}
      DATABASE_NAME: ${POSTGRES_DB:-flowforge}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowforge-net

networks:
  flowforge-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
